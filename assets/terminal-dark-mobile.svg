<svg xmlns="http://www.w3.org/2000/svg" width="520" height="354" viewBox="0 0 520 354" role="img" aria-labelledby="title desc">
<title id="title">Yukai Wang — terminal profile</title>
<desc id="desc">Undergraduate at Shanghai Jiao Tong University. Interested in memory, retrieval, and reliable LLM agents.</desc>
<defs><clipPath id="reveal"><rect class="reveal" x="0" y="0" width="520" height="354"/></clipPath></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;}
.typing{clip-path:url(#reveal);}
.reveal{animation:typing 1.6s steps(10,end) both;}
.cursor{animation:blink .9s step-end 5;}
@keyframes typing{from{width:0;}to{width:520px;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
@media(prefers-reduced-motion:reduce){.reveal,.cursor{animation:none;}}
</style>
